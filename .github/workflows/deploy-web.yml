name: Сборка и публикация зоомагазина

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и формат
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze

      - name: Тесты
        run: flutter test

      - name: Проверка Secrets Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Добавьте Repository secrets: SUPABASE_URL и SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$SUPABASE_URL" in
            *rest/v1*) echo "::error::SUPABASE_URL без /rest/v1/ — только https://xxxx.supabase.co"; exit 1 ;;
          esac

      - name: Релизная сборка для подкаталога GitHub Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BASE="/${{ github.event.repository.name }}/"
          flutter build web --release --base-href "$BASE" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/web/index.html build/web/404.html

      - name: Публикация ветки gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
