name: Сборка и публикация зоомагазина

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и формат
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze

      - name: Тесты
        run: flutter test

      - name: Релизная сборка для подкаталога GitHub Pages
        run: |
          BASE="/${{ github.event.repository.name }}/"
          # Ключи берутся из lib/core/config.dart (без пустых dart-define).
          flutter build web --release --base-href "$BASE"
          cp build/web/index.html build/web/404.html

      - name: Публикация ветки gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
