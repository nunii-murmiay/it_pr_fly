name: Сборка и публикация зоомагазина

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и формат
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze

      - name: Тесты
        run: flutter test

      - name: Релизная сборка для подкаталога GitHub Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BASE="/${{ github.event.repository.name }}/"
          # Пустые secrets не передаём: иначе fromEnvironment даёт "" и ломает вход.
          DEFINE_ARGS=""
          if [ -n "$SUPABASE_URL" ]; then
            DEFINE_ARGS="$DEFINE_ARGS --dart-define=SUPABASE_URL=$SUPABASE_URL"
          else
            echo "SUPABASE_URL secret пуст — URL из lib/core/config.dart"
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINE_ARGS="$DEFINE_ARGS --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          else
            echo "SUPABASE_ANON_KEY secret пуст — ключ из lib/core/config.dart"
          fi
          # shellcheck disable=SC2086
          flutter build web --release --base-href "$BASE" $DEFINE_ARGS
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
